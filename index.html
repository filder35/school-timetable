<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьное расписание</title>
  <style>
  /* Глубокий насыщенный фон на всю страницу WordPress */
  body, .wp-site-blocks {
    background-color: #0f172a !important;
    background-image: 
      radial-gradient(at 15% 10%, rgba(37, 99, 235, 0.45) 0px, transparent 50%),
      radial-gradient(at 85% 15%, rgba(79, 70, 229, 0.45) 0px, transparent 50%),
      radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.25) 0px, transparent 60%),
      linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%) !important;
    background-attachment: fixed !important;
    min-height: 100vh !important;
  }
  /* Полупрозрачный стеклянный контейнер блока расписания поверх темного фона */
  .asc-wrapper {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    color: #1e293b !important;
    width: 100% !important;
    max-width: 1280px !important;
    margin: 22px auto !important;
    padding: 22px !important;
    background: rgba(255, 255, 255, 0.08) !important;
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
    border-radius: 24px !important;
    border: 1px solid rgba(255, 255, 255, 0.16) !important;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35) !important;
    box-sizing: border-box !important;
  }
  .asc-wrapper * { box-sizing: border-box !important; }
  .asc-wrapper p:empty, .asc-wrapper > br, .day-card br { display: none !important; }
  /* Контрастная шапка внутри блока */
  .asc-header {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 14px !important;
    justify-content: space-between !important;
    align-items: center !important;
    margin-bottom: 20px !important;
    background: rgba(255, 255, 255, 0.95) !important;
    padding: 14px 22px !important;
    border-radius: 16px !important;
    border: 1px solid rgba(255, 255, 255, 0.9) !important;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2) !important;
  }
  .asc-title-group { display: flex !important; flex-wrap: wrap !important; align-items: center !important; gap: 14px !important; }
  .asc-header h2 { margin: 0 !important; padding: 0 !important; color: #0f172a !important; font-size: 20px !important; font-weight: 700 !important; border: none !important; line-height: 1.2 !important; }
  .asc-tabs { display: inline-flex !important; background: #f1f5f9 !important; padding: 4px !important; border-radius: 10px !important; gap: 4px !important; }
  .asc-tab { border: none !important; background: transparent !important; color: #475569 !important; padding: 6px 14px !important; font-size: 14px !important; font-weight: 600 !important; border-radius: 7px !important; cursor: pointer !important; line-height: 1.2 !important; }
  .asc-tab.active { background: #2563eb !important; color: #ffffff !important; box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25) !important; }
  .asc-controls label { display: flex !important; gap: 10px !important; align-items: center !important; color: #334155 !important; font-size: 14px !important; font-weight: 600 !important; margin: 0 !important; }
  .asc-controls select { padding: 7px 14px !important; font-size: 15px !important; border-radius: 9px !important; border: 1px solid #cbd5e1 !important; background: #f8fafc !important; color: #0f172a !important; font-weight: 600 !important; cursor: pointer !important; min-width: 170px !important; }
  .schedule-grid { display: grid !important; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)) !important; gap: 16px !important; align-items: stretch !important; }
  /* Усиленная тень у белых карточек на темном фоне */
  .day-card {
    background: #ffffff !important;
    border-radius: 16px !important;
    padding: 0 16px 14px 16px !important;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.22) !important;
    border: none !important;
    overflow: hidden !important;
  }
  /* Яркий акцентный фон для сегодняшнего дня */
  .day-card.is-today {
    border: 2px solid #2563eb !important;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.14) !important;
  }
  /* Красивый градиентный фон в названии дня недели */
  .day-card h3 {
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    margin: 0 -16px 10px -16px !important;
    padding: 10px 16px !important;
    background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%) !important;
    color: #1e3a8a !important;
    border-bottom: 1px solid #c7d2fe !important;
    font-size: 16px !important;
    font-weight: 700 !important;
    line-height: 1.2 !important;
  }
  .day-card.is-today h3 {
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%) !important;
    color: #ffffff !important;
    border-bottom: none !important;
  }
  .day-card.is-today .today-badge {
    background: rgba(255, 255, 255, 0.22) !important;
    color: #ffffff !important;
  }
  .today-badge { background: #dbeafe !important; color: #1d4ed8 !important; font-size: 11px !important; font-weight: 700 !important; padding: 2px 8px !important; border-radius: 99px !important; text-transform: uppercase !important; }
  .lesson-row { display: flex !important; align-items: flex-start !important; padding: 6px !important; margin: 0 -6px !important; border-bottom: 1px solid #f1f5f9 !important; gap: 8px !important; border-radius: 8px !important; }
  .lesson-row:last-child { border-bottom: none !important; padding-bottom: 2px !important; }
  .lesson-row.is-current { background: #ecfdf5 !important; border-bottom-color: transparent !important; box-shadow: inset 3px 0 0 #10b981 !important; }
  .now-badge { display: inline-block !important; background: #10b981 !important; color: #fff !important; font-size: 10px !important; font-weight: 700 !important; padding: 1px 6px !important; border-radius: 4px !important; margin-left: 6px !important; vertical-align: middle !important; }
  .lesson-num { width: 18px !important; flex-shrink: 0 !important; font-weight: 700 !important; color: #2563eb !important; font-size: 13.5px !important; line-height: 1.25 !important; }
  .lesson-row.is-current .lesson-num { color: #059669 !important; }
  .lesson-time { width: 76px !important; flex-shrink: 0 !important; color: #64748b !important; font-size: 11.5px !important; line-height: 1.3 !important; white-space: nowrap !important; }
  .lesson-content { flex: 1 !important; min-width: 0 !important; }
  .lesson-item { margin-bottom: 4px !important; line-height: 1.25 !important; }
  .lesson-item:last-child { margin-bottom: 0 !important; }
  .lesson-item strong { font-size: 13.5px !important; font-weight: 600 !important; color: #0f172a !important; }
  .group-badge { display: inline-block !important; background: #eff6ff !important; color: #2563eb !important; font-size: 10.5px !important; font-weight: 600 !important; padding: 1px 5px !important; border-radius: 4px !important; margin-left: 5px !important; }
  .meta { color: #64748b !important; font-size: 12px !important; display: block !important; margin-top: 2px !important; line-height: 1.2 !important; }
  @media (max-width: 640px) { .asc-wrapper { padding: 12px !important; } .schedule-grid { grid-template-columns: 1fr !important; } .asc-controls, .asc-controls label { width: 100% !important; } .asc-controls select { flex: 1 !important; } }
    /* Кнопка печати в шапке */
  .asc-print-btn {
    padding: 7px 14px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    border-radius: 9px !important;
    border: 1px solid #cbd5e1 !important;
    background: #ffffff !important;
    color: #334155 !important;
    cursor: pointer !important;
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    transition: all 0.15s ease !important;
  }
  .asc-print-btn:hover {
    background: #f1f5f9 !important;
    color: #0f172a !important;
    border-color: #94a3b8 !important;
  }
  .asc-print-title {
    display: none !important;
  }

      /* Заголовок школы (скрыт на экране, виден только при печати на А4) */
  .asc-school-name {
    display: none !important;
  }

  /* Адаптация и компактный вид для смартфонов */
  @media (max-width: 640px) {
    html, body, .wp-site-blocks { background-attachment: scroll !important; }
    .asc-wrapper { padding: 10px !important; margin: 6px auto !important; border-radius: 14px !important; border: none !important; }
    .asc-header { padding: 12px !important; gap: 10px !important; margin-bottom: 12px !important; border-radius: 12px !important; }
    .asc-title-group { width: 100% !important; flex-direction: column !important; align-items: stretch !important; gap: 8px !important; }
    .asc-header h2 { font-size: 18px !important; text-align: center !important; }
    .asc-tabs { display: flex !important; width: 100% !important; }
    .asc-tab { flex: 1 !important; text-align: center !important; padding: 7px 6px !important; font-size: 13px !important; }
    .asc-controls { width: 100% !important; display: flex !important; gap: 8px !important; }
    .asc-controls label { flex: 1 !important; min-width: 0 !important; gap: 6px !important; font-size: 13px !important; }
    .asc-controls select { flex: 1 !important; min-width: 0 !important; width: 100% !important; padding: 7px 10px !important; font-size: 14px !important; }
    .asc-print-btn { padding: 7px 10px !important; font-size: 13px !important; white-space: nowrap !important; }
    .schedule-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
    .day-card { border-radius: 12px !important; padding: 0 12px 10px 12px !important; }
    .day-card h3 { margin: 0 -12px 6px -12px !important; padding: 8px 12px !important; font-size: 15px !important; }
    .lesson-row { padding: 5px 4px !important; margin: 0 -4px !important; gap: 6px !important; }
    .lesson-num { width: 16px !important; font-size: 13px !important; }
    .lesson-time { width: 68px !important; font-size: 11px !important; }
    .lesson-item strong { font-size: 13px !important; }
    .meta { font-size: 11.5px !important; }
  }

  /* Специальные правила при печати и сохранении в PDF на А4 */
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    html, body, .wp-site-blocks { background: #ffffff !important; background-image: none !important; min-height: auto !important; }
    body * { visibility: hidden !important; }
    #asc-app, #asc-app * { visibility: visible !important; }
    #asc-app { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
    .asc-wrapper { background: #ffffff !important; background-image: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
    .asc-header { background: #ffffff !important; box-shadow: none !important; border: none !important; border-bottom: 2px solid #000000 !important; border-radius: 0 !important; padding: 0 0 6px 0 !important; margin-bottom: 10px !important; display: block !important; }
    .asc-school-name { display: block !important; font-size: 13px !important; font-weight: 600 !important; color: #334155 !important; text-transform: uppercase !important; letter-spacing: 0.5px !important; margin-bottom: 2px !important; }
    .asc-header h2, .asc-print-title { font-size: 20px !important; color: #000000 !important; display: inline !important; }
    .asc-tabs, .asc-controls, .today-badge, .now-badge { display: none !important; }
    .schedule-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px !important; }
    .day-card { box-shadow: none !important; border: 1.5px solid #475569 !important; border-radius: 8px !important; padding: 0 9px 7px 9px !important; break-inside: avoid !important; page-break-inside: avoid !important; }
    .day-card h3 { font-size: 15px !important; margin: 0 -9px 4px -9px !important; padding: 5px 9px !important; background: #f1f5f9 !important; border-bottom: 1.5px solid #000000 !important; color: #000000 !important; }
    .lesson-row { padding: 3px 0 !important; margin: 0 !important; gap: 6px !important; background: transparent !important; box-shadow: none !important; border-bottom: 1px solid #cbd5e1 !important; }
    .lesson-num { width: 16px !important; color: #000000 !important; font-size: 13px !important; font-weight: 700 !important; }
    .lesson-time { width: 68px !important; color: #1e293b !important; font-size: 11px !important; }
    .lesson-item strong { color: #000000 !important; font-size: 13.5px !important; font-weight: 700 !important; }
    .meta { color: #1e293b !important; font-size: 11.5px !important; margin-top: 1px !important; }
    .group-badge { border: 1px solid #64748b !important; background: transparent !important; color: #000000 !important; font-size: 10px !important; padding: 0 4px !important; }
  }
</style>

<div id="asc-app"></div>

<script>
  (function () {
      const XML_URL = './timetable.xml';
      // Если в timetable.xml не указано название школы, впишите его сюда в кавычках (например: 'МБОУ СОШ № 1'):
      const CUSTOM_SCHOOL_NAME = 'МБОУ СОШ № 4';

      const app = document.getElementById('asc-app');
      if (!app) return;

      const wrapper = document.createElement('div');
      wrapper.className = 'asc-wrapper';

      const header = document.createElement('div');
      header.className = 'asc-header';

      const titleGroup = document.createElement('div');
      titleGroup.className = 'asc-title-group';

      const schoolNameEl = document.createElement('div');
      schoolNameEl.className = 'asc-school-name';
      titleGroup.appendChild(schoolNameEl);

      const h2 = document.createElement('h2');
      h2.textContent = 'Расписание';

      const printTitle = document.createElement('span');
      printTitle.className = 'asc-print-title';
      h2.appendChild(printTitle);
      titleGroup.appendChild(h2);


    const tabsBox = document.createElement('div');
    tabsBox.className = 'asc-tabs';
    const tabDefs = [['class', 'Классы'], ['teacher', 'Учителя'], ['room', 'Кабинеты']];
    const tabs = tabDefs.map(([mode, text], idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'asc-tab' + (idx === 0 ? ' active' : '');
      btn.dataset.mode = mode;
      btn.textContent = text;
      tabsBox.appendChild(btn);
      return btn;
    });
    titleGroup.appendChild(tabsBox);

    const controls = document.createElement('div');
    controls.className = 'asc-controls';
    controls.style.display = 'flex';
    controls.style.flexWrap = 'wrap';
    controls.style.gap = '10px';
    controls.style.alignItems = 'center';

    const label = document.createElement('label');
    const labelEl = document.createElement('span');
    labelEl.className = 'asc-select-label';
    labelEl.textContent = 'Класс:';
    const selectEl = document.createElement('select');
    selectEl.className = 'asc-entity-select';
    label.append(labelEl, selectEl);

    const printBtn = document.createElement('button');
    printBtn.type = 'button';
    printBtn.className = 'asc-print-btn';
    printBtn.textContent = '🖨 Печать / PDF';
    printBtn.addEventListener('click', () => {
      const opt = selectEl.options[selectEl.selectedIndex];
      printTitle.textContent = opt ? ' — ' + opt.textContent : '';
      window.print();
    });

    controls.append(label, printBtn);
    header.append(titleGroup, controls);

    const containerEl = document.createElement('div');
    containerEl.className = 'schedule-grid asc-schedule-container';
    containerEl.textContent = 'Загрузка расписания...';

    wrapper.append(header, containerEl);
    app.appendChild(wrapper);

    let currentMode = 'class';
    const db = { periods: {}, periodBounds: {}, days: [], subjects: {}, teachers: {}, classes: {}, classrooms: {}, groups: {}, lessons: {}, cards: [] };

    function toMins(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return !isNaN(h) && !isNaN(m) ? h * 60 + m : null;
    }

    fetch(XML_URL + '?v=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(buf => {
        const txt = new TextDecoder('windows-1251').decode(buf).replace(/encoding=["']windows-1251["']/i, 'encoding="UTF-8"');
        const xml = new DOMParser().parseFromString(txt, "text/xml");
        if (xml.querySelector('parsererror')) throw new Error('Ошибка XML');
        parseXml(xml);
        tabs.forEach(btn => btn.addEventListener('click', () => {
          tabs.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          switchMode(btn.dataset.mode);
        }));
        selectEl.addEventListener('change', e => render(e.target.value));
        switchMode('class');
        setInterval(() => render(selectEl.value), 60000);
      })
      .catch(err => { containerEl.innerHTML = '<p style="color:#dc2626;background:#fff;padding:12px;border-radius:8px;">Ошибка: ' + err.message + '</p>'; });

    function parseXml(xml) {
      const tt = xml.querySelector('timetable');
      const xmlSchool = tt ? (tt.getAttribute('schoolname') || tt.getAttribute('name') || '') : '';
      schoolNameEl.textContent = CUSTOM_SCHOOL_NAME || xmlSchool;
      for (let el of xml.getElementsByTagName('period')) {
        const p = el.getAttribute('period'), st = el.getAttribute('starttime'), et = el.getAttribute('endtime');
        db.periods[p] = st + '–' + et;
        db.periodBounds[p] = { start: toMins(st), end: toMins(et) };
      }
      for (let el of xml.getElementsByTagName('daysdef')) {
        const m = el.getAttribute('days');
        if (m && !m.includes(',') && (m.match(/1/g) || []).length === 1) db.days.push({ index: m.indexOf('1'), name: el.getAttribute('name') });
      }
      db.days.sort((a, b) => a.index - b.index);
      for (let el of xml.getElementsByTagName('subject')) db.subjects[el.getAttribute('id')] = el.getAttribute('name');
      for (let el of xml.getElementsByTagName('teacher')) db.teachers[el.getAttribute('id')] = el.getAttribute('short') || el.getAttribute('name');
      for (let el of xml.getElementsByTagName('class')) db.classes[el.getAttribute('id')] = el.getAttribute('name');
      for (let el of xml.getElementsByTagName('classroom')) db.classrooms[el.getAttribute('id')] = el.getAttribute('short') || el.getAttribute('name');
      for (let el of xml.getElementsByTagName('group')) db.groups[el.getAttribute('id')] = el.getAttribute('name');
      for (let el of xml.getElementsByTagName('lesson')) {
        db.lessons[el.getAttribute('id')] = {
          subjectId: el.getAttribute('subjectid'),
          classIds: (el.getAttribute('classids') || '').split(',').filter(Boolean),
          teacherIds: (el.getAttribute('teacherids') || '').split(',').filter(Boolean),
          groupIds: (el.getAttribute('groupids') || '').split(',').filter(Boolean),
          classroomIds: (el.getAttribute('classroomids') || '').split(',').filter(Boolean)
        };
      }
      for (let el of xml.getElementsByTagName('card')) {
        db.cards.push({ lessonId: el.getAttribute('lessonid'), period: el.getAttribute('period'), daysMask: el.getAttribute('days'), classroomIds: (el.getAttribute('classroomids') || '').split(',').filter(Boolean) });
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const map = { class: [db.classes, 'Класс:'], teacher: [db.teachers, 'Учитель:'], room: [db.classrooms, 'Кабинет:'] };
      const [source, label] = map[mode];
      labelEl.textContent = label;
      selectEl.innerHTML = '';
      const sorted = Object.entries(source).sort(([, a], [, b]) => a.localeCompare(b, 'ru', { numeric: true }));
      sorted.forEach(([id, name]) => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = name; selectEl.appendChild(opt);
      });
      if (sorted.length) { const [[firstId]] = sorted; render(firstId); }
    }

    function render(entityId) {
      containerEl.innerHTML = '';
      const now = new Date();
      const todayIndex = (now.getDay() + 6) % 7;
      const nowMins = now.getHours() * 60 + now.getMinutes();

      db.days.forEach(day => {
        const isToday = day.index === todayIndex;
        const cards = db.cards.filter(c => {
          const l = db.lessons[c.lessonId];
          if (!l || !c.daysMask || c.daysMask[day.index] !== '1') return false;
          if (currentMode === 'class') return l.classIds.includes(entityId);
          if (currentMode === 'teacher') return l.teacherIds.includes(entityId);
          const rIds = c.classroomIds.length ? c.classroomIds : l.classroomIds;
          return rIds.includes(entityId);
        });
        if (!cards.length) return;

        const byP = {};
        cards.forEach(c => { (byP[c.period] = byP[c.period] || []).push(c); });
        let rows = '';
        Object.keys(byP).sort((a, b) => a - b).forEach(p => {
          const b = db.periodBounds[p];
          const isCurrent = isToday && b && b.start !== null && nowMins >= b.start && nowMins <= b.end;
          const items = byP[p].map(c => {
            const l = db.lessons[c.lessonId];
            const subj = db.subjects[l.subjectId] || 'Предмет';
            const cls = l.classIds.map(id => db.classes[id]).filter(Boolean).join(', ');
            const teach = l.teacherIds.map(id => db.teachers[id]).filter(Boolean).join(', ');
            const rIds = c.classroomIds.length ? c.classroomIds : l.classroomIds;
            const rooms = rIds.map(id => db.classrooms[id]).filter(Boolean).join(', ');
            const grps = l.groupIds.map(id => db.groups[id]).filter(g => g && g !== 'Весь класс').join(', ');
            const badge = grps ? '<span class="group-badge">' + grps + '</span>' : '';
            const metaArr = currentMode === 'class' ? [teach, rooms ? 'каб. ' + rooms : ''] : currentMode === 'teacher' ? [cls ? 'кл. ' + cls : '', rooms ? 'каб. ' + rooms : ''] : [cls ? 'кл. ' + cls : '', teach];
            return '<div class="lesson-item"><strong>' + subj + '</strong>' + badge + '<span class="meta">' + metaArr.filter(Boolean).join(' • ') + '</span></div>';
          }).join('');
          const nowTag = isCurrent ? '<span class="now-badge">Идёт сейчас</span>' : '';
          rows += '<div class="lesson-row' + (isCurrent ? ' is-current' : '') + '"><div class="lesson-num">' + p + '</div><div class="lesson-time">' + (db.periods[p] || '') + '</div><div class="lesson-content">' + items + nowTag + '</div></div>';
        });
        const el = document.createElement('div');
        el.className = 'day-card' + (isToday ? ' is-today' : '');
        el.innerHTML = '<h3><span>' + day.name + '</span>' + (isToday ? '<span class="today-badge">Сегодня</span>' : '') + '</h3>' + rows;
        containerEl.appendChild(el);
      });
    }
  })();
</script>
